# Goal: Whenever someone changes the python code,
# the linter will check if the syntax, format, indentation(linting) is correct or not
name: Auto Linter

on: 
  push: 
    paths:
      - "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    # this step will automatically clone the code of the current branch into the runner
    steps:
      - name: Checkout/Clone the Code
        uses: actions/checkout@v7
    # 2. Install the specified Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Specify your target version
    # this step will install the lintering tool 
      -  name: Install Linter
         run: pip install ruff
    # this step will run the linter
      -  name: Check the files for linting
         run: ruff check .





    
